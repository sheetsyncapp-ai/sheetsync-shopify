<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — SheetSync for Shopify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f6f7; }
  </style>
</head>
<body class="text-gray-900 py-12 px-4 sm:px-6">
  <div class="max-w-3xl mx-auto bg-white p-8 sm:p-12 rounded-lg shadow-sm border border-gray-200">
    <div class="flex items-center space-x-3 mb-8 pb-4 border-b border-gray-200">
      <div class="w-8 h-8 rounded bg-emerald-600 flex items-center justify-center text-white font-bold text-sm">
        S
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">SheetSync for Shopify</h1>
        <p class="text-xs text-gray-500">Official Legal Documentation</p>
      </div>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-4">{{ title }}</h2>
    <p class="text-xs text-gray-400 mb-8">Last updated: November 24, 2026</p>

    <div class="prose prose-sm text-gray-700 space-y-6 leading-relaxed">
      {{ content | safe }}
    </div>

    <div class="mt-12 pt-6 border-t border-gray-200 text-xs text-gray-500 flex justify-between items-center">
      <span>Contact: <a href="mailto:sheetsync.app@gmail.com" class="text-emerald-600 underline">sheetsync.app@gmail.com</a></span>
      <a href="/" class="text-emerald-600 hover:underline">Back to SheetSync</a>
    </div>
  </div>
</body>
</html>
